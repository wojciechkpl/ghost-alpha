[package]
name = "ghost-alpha"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/wojciechkpl/ghost-alpha"
default-run = "ghost-alpha"

[[bin]]
name = "ghost-alpha"
path = "src/main.rs"

[lib]
name = "ghost_alpha"
path = "src/lib.rs"

[[bin]]
name = "ghost-alpha-mcp"
path = "src/bin/ghost-alpha-mcp.rs"

[features]
default = []
integration = []
test-support = []
mcp = ["rmcp", "schemars"]
sentiment = ["ort", "tokenizers"]

[dependencies]
tokio        = { version = "1", features = ["full"] }
reqwest      = { version = "0.12", features = ["json", "gzip"] }
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
csv          = "1.3"
toml         = "0.8"
clap         = { version = "4", features = ["derive", "color", "env"] }
rusqlite     = { version = "0.31", features = ["bundled"] }
chrono       = { version = "0.4", features = ["serde"] }
tracing      = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow       = "1"
thiserror    = "1"
indicatif    = "0.17"
colored      = "2"
governor     = "0.6"
backoff      = { version = "0.4", features = ["tokio"] }
async-trait  = "0.1"
futures      = "0.3"
dotenvy      = "0.15"
dialoguer    = "0.11"
url          = "2"

# MCP server (optional — enabled via `cargo build --features mcp`)
rmcp         = { version = "0.17", features = ["server", "transport-io"], optional = true }
schemars     = { version = "1", optional = true }

# Sentiment (optional — enabled via `cargo build --features sentiment`)
ort          = { version = "2.0.0-rc.11", features = ["load-dynamic"], optional = true }
tokenizers   = { version = "0.15", optional = true }

# Web dashboard (ghost-alpha serve)
axum         = "0.7"
tower-http   = { version = "0.5", features = ["cors"] }
tower        = { version = "0.4", features = ["util"] }
rust-embed   = "8"
mime_guess   = "2"

# Backtesting (Monte Carlo bootstrap)
rand         = "0.8"

# Portfolio tax-lot tracking
uuid         = { version = "1", features = ["v4", "serde"] }
nalgebra = "0.33"
rand_distr = "0.4"

[dev-dependencies]
tokio-test   = "0.4"
approx       = "0.5"
criterion    = { version = "0.5", features = ["html_reports"] }
wiremock     = "0.6"
tempfile     = "3"

[[bench]]
name = "indicators_bench"
harness = false

[[bench]]
name = "projection_mc"
harness = false

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
